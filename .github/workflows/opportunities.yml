name: Opportunities

# Refreshes the Opportunities page on connect.quantt.ca from public quant job
# lists (scripts/sync-opportunities.mjs). Runs daily; "Run workflow" on the
# Actions tab runs it now.
#
# Needs the repo secret OPPORTUNITIES_SYNC_TOKEN, with the same value as the
# Worker secret of that name on quantt-connect. It posts to the Worker's
# workers.dev address (repo variable CONNECT_URL overrides it).
# connect.quantt.ca itself sits behind Cloudflare's bot challenge, which
# answers requests from GitHub's runners with a 403 page.

on:
  schedule:
    - cron: "15 11 * * *" # 06:15 / 07:15 in Kingston
  workflow_dispatch:

concurrency:
  group: opportunities
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Fetch, filter and send listings
        env:
          OPPORTUNITIES_SYNC_TOKEN: ${{ secrets.OPPORTUNITIES_SYNC_TOKEN }}
          CONNECT_URL: ${{ vars.CONNECT_URL || 'https://quantt-connect.quanttgroup.workers.dev' }}
          # New listings are posted to #opportunities in the QUANTT Discord (QUANTT Bot).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_OPPORTUNITIES_CHANNEL: "1566267471349030933"
        run: node --experimental-strip-types scripts/sync-opportunities.mjs
