name: Opportunities

# The daily Opportunities run happens in the quantt-connect Worker's own cron
# (11:00 UTC, lib/jobs/daily.ts): it fetches the public quant job lists, stores
# them, and posts new roles to #opportunities in the QUANTT Discord with the
# Worker's DISCORD_BOT_TOKEN secret. GitHub's schedule ran hours late and kept
# its own copy of the bot token, which went stale, so it no longer runs here.
#
# "Run workflow" asks the Worker to do a run now. Needs the repo secret
# OPPORTUNITIES_SYNC_TOKEN (same value as the Worker secret). It calls the
# workers.dev address (repo variable CONNECT_URL overrides it), because
# connect.quantt.ca answers GitHub's runners with Cloudflare's bot challenge.

on:
  workflow_dispatch:
    inputs:
      post_all:
        description: "Post all open roles to Discord (not just new ones)"
        type: boolean
        default: false

concurrency:
  group: opportunities
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the Opportunities sync on the Worker
        env:
          OPPORTUNITIES_SYNC_TOKEN: ${{ secrets.OPPORTUNITIES_SYNC_TOKEN }}
          CONNECT_URL: ${{ vars.CONNECT_URL || 'https://quantt-connect.quanttgroup.workers.dev' }}
          POST_ALL: ${{ inputs.post_all && '1' || '0' }}
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "authorization: Bearer $OPPORTUNITIES_SYNC_TOKEN" \
            "$CONNECT_URL/api/opportunities/run?post_all=$POST_ALL")
          head -c 3000 body.json; echo
          echo "HTTP $status"
          test "$status" = 200
