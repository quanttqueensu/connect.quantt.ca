# One-off: refreshes package-lock.json after the Cloudflare packages were added from an environment
# without npm access. Delete this file once the lockfile commit lands.
name: Refresh lockfile
on:
  push:
    branches: ["claude/project-thread-1lttb3"]
    paths: ["package.json"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git diff --quiet package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh package-lock.json for the Cloudflare packages"
          git push
