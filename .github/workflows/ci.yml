name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in step with .nvmrc and the "engines" field in package.json.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Type-aware (no-floating-promises), so this takes ~1-2 minutes.
        run: npm run lint

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        # `next build` typechecks the application code as part of the build,
        # which is why there is no separate `npm run typecheck` step here.
        run: npm run build
